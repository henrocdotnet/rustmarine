[package]
name = "rustmarine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local Sonar analysis for coding agents and humans"
license = "LGPL-3.0-or-later"
publish = false

[[bin]]
name = "rustmarine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
url = "2"

[dev-dependencies]
